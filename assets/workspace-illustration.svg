<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">OfficeMate — a calm, local-first workspace</title>
<desc id="desc">A polished OfficeMate dashboard illustration with private local files, quick actions, and a document search.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f6f1"/><stop offset="1" stop-color="#e7eee7"/></linearGradient>
  <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b6d8c3"/><stop offset="1" stop-color="#d5e4d6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#344d3e" flood-opacity=".13"/></filter>
  <style>.sans{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}</style>
</defs>
<rect width="1200" height="560" rx="30" fill="url(#bg)"/>
<circle cx="1050" cy="60" r="175" fill="url(#orb)" opacity=".52"/><circle cx="80" cy="525" r="150" fill="#d9e8df" opacity=".52"/>
<g class="sans" fill="#26372e">
  <rect x="72" y="67" width="36" height="36" rx="12" fill="#315e48"/><path d="M83 76h12l6 6v15H83zM95 76v7h6M86 88h10M86 92h7" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="92" font-size="21" font-weight="700">OfficeMate</text>
  <rect x="812" y="73" width="150" height="30" rx="15" fill="#e2ece3"/><circle cx="830" cy="88" r="4" fill="#5d9b70"/><text x="842" y="92" font-size="11" fill="#476451">LOCAL-FIRST · OPEN SOURCE</text>
  <text x="72" y="208" font-size="48" font-weight="650" letter-spacing="-1.6">Your office,</text>
  <text x="72" y="263" class="serif" font-size="54" font-style="italic" fill="#47775a">handled.</text>
  <text x="73" y="305" font-size="16" fill="#68756b">A thoughtful workspace for files, notes,</text><text x="73" y="330" font-size="16" fill="#68756b">and everyday office tasks — right on your device.</text>
  <g transform="translate(72 373)"><rect width="150" height="39" rx="12" fill="#315e48"/><text x="19" y="25" fill="white" font-size="13" font-weight="600">150 local tools</text><path d="M126 15l6 5-6 5" stroke="white" stroke-width="1.6" fill="none"/></g>
  <g transform="translate(72 444)"><circle cx="8" cy="8" r="8" fill="#dcebe0"/><path d="M4 8l3 3 5-6" fill="none" stroke="#47775a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="12" font-size="12" fill="#68756b">Your documents never leave your workspace</text></g>
</g>
<!-- Dashboard illustration -->
<g filter="url(#shadow)" transform="translate(438 126)">
  <rect width="695" height="368" rx="18" fill="#fff"/>
  <path d="M18 0h659a18 18 0 0 1 18 18v31H0V18A18 18 0 0 1 18 0" fill="#fbfcfa"/>
  <circle cx="22" cy="23" r="4" fill="#e2a296"/><circle cx="37" cy="23" r="4" fill="#e6c881"/><circle cx="52" cy="23" r="4" fill="#8fba9b"/>
  <rect x="72" y="13" width="139" height="20" rx="10" fill="#f0f3ef"/><text x="86" y="27" class="sans" font-size="9" fill="#7b897e">OfficeMate · Workspace</text>
  <rect x="0" y="49" width="142" height="319" rx="0" fill="#f8faf7"/><rect x="18" y="68" width="23" height="23" rx="7" fill="#315e48"/><path d="M25 73h7l4 4v9H25zM32 73v4h4" fill="none" stroke="#fff" stroke-width="1"/>
  <text x="48" y="84" class="sans" font-size="11" font-weight="700" fill="#314338">OfficeMate</text>
  <text x="18" y="118" class="sans" font-size="8" font-weight="700" letter-spacing="1" fill="#a0aaa1">WORKSPACE</text>
  <rect x="12" y="127" width="117" height="29" rx="8" fill="#e8efe9"/><text x="34" y="146" class="sans" font-size="10" fill="#355d43">Overview</text>
  <text x="34" y="176" class="sans" font-size="10" fill="#718076">My files</text><text x="34" y="205" class="sans" font-size="10" fill="#718076">Search</text>
  <text x="18" y="239" class="sans" font-size="8" font-weight="700" letter-spacing="1" fill="#a0aaa1">TOOLS</text><text x="34" y="263" class="sans" font-size="10" fill="#718076">150 tools</text><text x="34" y="291" class="sans" font-size="10" fill="#718076">Templates</text><text x="34" y="319" class="sans" font-size="10" fill="#718076">Activity log</text>
  <g class="sans"><text x="168" y="83" font-size="8" font-weight="700" letter-spacing="1.2" fill="#7a997f">YOUR PERSONAL OFFICE ASSISTANT</text><text x="168" y="115" font-size="24" font-weight="650" fill="#293b30">Good work starts</text><text x="168" y="141" class="serif" font-size="26" font-style="italic" fill="#47775a">right here.</text><text x="168" y="160" font-size="10" fill="#89938a">What can I help you get done today?</text>
  <rect x="168" y="178" width="493" height="91" rx="12" fill="#f8faf7" stroke="#e7ece6"/><text x="184" y="200" font-size="10" font-weight="600" fill="#34493a">✳  Ask OfficeMate</text><rect x="567" y="188" width="71" height="17" rx="8.5" fill="#e4efe4"/><text x="581" y="200" font-size="7" font-weight="700" fill="#5c8063">LOCAL AI</text>
  <rect x="183" y="212" width="463" height="39" rx="9" fill="#fff" stroke="#e5eae4"/><text x="198" y="236" font-size="10" fill="#9ba59d">⌕  Find a budget report or summarize a document…</text><circle cx="624" cy="231" r="12" fill="#315e48"/><path d="M619 231h9m-4-4 4 4-4 4" stroke="#fff" stroke-width="1.2" fill="none"/>
  <text x="168" y="297" font-size="13" font-weight="700" fill="#334138">Quick actions</text><text x="168" y="311" font-size="8" fill="#8a958b">Everything you need, one click away.</text>
  <g><rect x="168" y="321" width="151" height="34" rx="8" fill="#fff" stroke="#e9ede8"/><rect x="180" y="329" width="18" height="18" rx="5" fill="#ece8f7"/><text x="205" y="337" font-size="8" font-weight="600" fill="#435147">New document</text><text x="205" y="348" font-size="7" fill="#9aa39a">Start a note or draft</text>
  <rect x="330" y="321" width="151" height="34" rx="8" fill="#fff" stroke="#e9ede8"/><rect x="342" y="329" width="18" height="18" rx="5" fill="#e5eff8"/><text x="367" y="337" font-size="8" font-weight="600" fill="#435147">Use a template</text><text x="367" y="348" font-size="7" fill="#9aa39a">Start with a layout</text>
  <rect x="492" y="321" width="151" height="34" rx="8" fill="#fff" stroke="#e9ede8"/><rect x="504" y="329" width="18" height="18" rx="5" fill="#f8ece5"/><text x="529" y="337" font-size="8" font-weight="600" fill="#435147">Convert a file</text><text x="529" y="348" font-size="7" fill="#9aa39a">Switch formats</text></g></g>
</g>
</svg>